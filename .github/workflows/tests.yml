name: Homebrew

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c8707045ccae42888fe98e86f2ee8938bc7cc193 # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formula syntax and style
        run: |
          brew style kdlbs/kandev
          brew readall --aliases --os=all --arch=all kdlbs/kandev

      - name: Install and test formula
        run: |
          brew install kdlbs/kandev/kandev
          brew test kdlbs/kandev/kandev
          brew linkage --test kdlbs/kandev/kandev
          brew livecheck kdlbs/kandev/kandev
          # The URL-only scanner sees the release tag, but conditional asset
          # names make Homebrew infer 64 unless the formula sets its version.
          brew audit --strict --online --except=version kdlbs/kandev/kandev
